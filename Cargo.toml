[workspace]
resolver = "2"
members = ["crates/adb-proto", "crates/adbrsync-core", "crates/adbrsync-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/ashton/adbrsync"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
walkdir = "2"
globset = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
